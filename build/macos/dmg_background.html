<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<style>
    @font-face {
        font-family: "MiSans";
        src: url("../../.github/pages/MiSansVF.ttf") format("truetype-variations"),
             url("../../.github/pages/MiSansVF.ttf") format("truetype");
        font-weight: 100 900;
    }

    @font-face {
        font-family: "Mohave";
        src: url("../../assets/Mohave.ttf") format("truetype-variations"),
             url("../../assets/Mohave.ttf") format("truetype");
        font-weight: 300 700;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
        width: 660px;
        height: 420px;
        overflow: hidden;
    }

    body {
        position: relative;
        background-color: #f5f5f7;
        font-family: "MiSans", sans-serif;
        -webkit-font-smoothing: antialiased;
    }

    body::before {
        content: "";
        position: absolute;
        top: -180px;
        left: 50%;
        width: 760px;
        height: 480px;
        margin-left: -380px;
        background: radial-gradient(50% 50% at 50% 50%, rgba(0, 113, 227, 0.10), transparent 70%);
    }

    .tagline {
        position: absolute;
        top: 44px;
        right: 0;
        left: 0;
        text-align: center;
        color: #a1a1a6;
        font-family: "Mohave", sans-serif;
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 2.4px;
        text-transform: uppercase;
    }

    .app-glow {
        position: absolute;
        top: 205px;
        left: 160px;
        width: 208px;
        height: 208px;
        margin: -104px 0 0 -104px;
        border-radius: 50%;
        background: radial-gradient(closest-side, rgba(0, 113, 227, 0.15), rgba(0, 113, 227, 0) 72%);
    }

    .arrow {
        position: absolute;
        top: 204px;
        left: 260px;
        width: 140px;
        height: 2px;
        border-radius: 2px;
        background: linear-gradient(90deg, #d2d2d7, #b8b8bf);
    }

    .arrow::after {
        content: "";
        position: absolute;
        top: 50%;
        right: 0;
        width: 9px;
        height: 9px;
        border-top: 2px solid #b8b8bf;
        border-right: 2px solid #b8b8bf;
        border-top-right-radius: 2px;
        transform: translateY(-50%) rotate(45deg);
        transform-origin: center;
    }

    .copy {
        position: absolute;
        top: 298px;
        right: 0;
        left: 0;
        text-align: center;
    }

    .copy strong {
        display: block;
        color: #1d1d1f;
        font-size: 13px;
        font-weight: 600;
        letter-spacing: 0.1px;
    }

    .copy span {
        display: block;
        margin-top: 7px;
        color: #86868b;
        font-size: 11px;
        line-height: 1.5;
    }

    .foot {
        position: absolute;
        right: 0;
        bottom: 38px;
        left: 0;
        text-align: center;
        color: #a1a1a6;
        font-size: 10.5px;
        line-height: 1.5;
    }
</style>
</head>
<body>
    <div class="tagline">Note, Nothing.</div>
    <div class="app-glow"></div>
    <div class="arrow"></div>
    <div class="copy">
        <strong>将 EsprinNemo 拖进「应用程序」</strong>
        <span>装好后从启动台或应用程序文件夹打开</span>
    </div>
    <div class="foot">首次打开若被系统拦截，请在「系统设置 → 隐私与安全性」中允许</div>
</body>
</html>
