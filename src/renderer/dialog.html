<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Esprin Nemo</title>
    <!-- 外观引导：明暗主题 / 主题风格 / 圆角尺度 / 主题色 / 应用名颜色 / 字体由主进程经命令行
         参数注入，与主窗口、小本本共用同一套应用逻辑（window_appearance.js），首屏渲染前落定 -->
    <script src="./window_appearance.js"></script>
    <script>window.applyWindowAppearance(window.readWindowAppearanceFromArgs());</script>
    <link rel="stylesheet" href="../../node_modules/material-symbols/rounded.css">
    <!-- 三个窗口共用同一套外观样式：tokens（颜色 / 字体 / 品牌字）→ window_shell（窗口骨架与标题栏）
         → alom（Alom 风格覆盖）→ radius（圆角尺度换算，按约定排在风格之后） -->
    <link rel="stylesheet" href="./styles/tokens.css">
    <link rel="stylesheet" href="./styles/window_shell.css">
    <link rel="stylesheet" href="./styles/alom.css">
    <link rel="stylesheet" href="./styles/radius.css">
    <!-- 动效层：内容淡入上浮（与主窗口、小本本共用同一份，见 styles/motion.css） -->
    <link rel="stylesheet" href="./styles/motion.css">
    <style>
        /* 高度必须由内容决定：window_shell.css 里 html/body 默认撑满窗口，
           那样量到的高度恒等于当前窗口高度，窗口永远缩不回内容大小，
           底部内边距会被裁掉、按钮就贴在窗口最下沿 */
        html, body {
            height: auto;
            overflow-x: hidden;
            overflow-y: hidden;
        }

        .dialog-container {
            display: flex;
            flex-direction: column;
            width: 100%;
            background-color: var(--bg-body);
        }

        /* 标题栏骨架（高度、拖动区域、背景与材质、应用名与窗口按钮）见 styles/window_shell.css，
           这里只补弹窗特有的标题文字 */
        .titlebar-title {
            flex: 1;
            min-width: 0;
            margin-left: 6px;
            padding-left: 10px;
            border-left: 1px solid var(--border-color);
            font-size: 12px;
            color: var(--text-secondary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* 弹窗内容 */
        .dialog-body {
            display: flex;
            flex-direction: column;
            gap: 16px;
            padding: 20px 20px 18px;
            background-color: var(--bg-body);
        }
        .dialog-head {
            display: flex;
            align-items: flex-start;
            gap: 12px;
        }
        .dialog-icon {
            font-size: 22px;
            flex-shrink: 0;
            margin-top: 1px;
            color: var(--accent);
        }
        .dialog-icon.warning { color: var(--warning); }
        .dialog-icon.error { color: var(--danger); }
        .dialog-text {
            flex: 1;
            min-width: 0;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .dialog-message {
            font-size: 13px;
            font-weight: 600;
            line-height: 1.5;
            word-break: break-word;
            user-select: text;
        }
        .dialog-detail {
            font-size: 12px;
            color: var(--text-secondary);
            line-height: 1.6;
            white-space: pre-wrap;
            word-break: break-word;
            user-select: text;
        }
        /* 自动关闭倒计时（仅 timeoutMs 有值时出现）：到点由主进程替我们收掉窗口 */
        .dialog-countdown {
            font-size: 11.5px;
            color: var(--text-muted);
            font-variant-numeric: tabular-nums;
        }

        .dialog-field {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .dialog-field-label {
            font-size: 12px;
            color: var(--text-secondary);
        }
        .dialog-input {
            width: 100%;
            background: var(--item-hover);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
            padding: 8px 10px;
            font-size: 13px;
            color: var(--text-primary);
            user-select: text;
        }
        .dialog-input:focus {
            border-color: var(--accent);
        }
        .dialog-input::placeholder {
            color: var(--text-secondary);
            opacity: 0.7;
        }

        /* 候选项：输入框下方的可点选气泡（multiple 时支持多选） */
        .dialog-choices {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
            max-height: 140px;
            overflow-y: auto;
            padding-top: 2px;
        }
        .dialog-choice {
            display: inline-flex;
            align-items: center;
            gap: 3px;
            padding: 3px 9px;
            border-radius: var(--radius-pill);
            background-color: var(--item-hover);
            color: var(--text-secondary);
            font-size: 11.5px;
            transition: background-color 0.15s, color 0.15s;
        }
        .dialog-choice .ms-icon {
            font-size: 13px;
            opacity: 0;
            transition: opacity 0.15s;
        }
        .dialog-choice:hover {
            background-color: var(--item-active);
            color: var(--text-primary);
        }
        .dialog-choice.selected {
            background-color: var(--accent-bg);
            color: var(--accent);
            font-weight: 500;
        }
        .dialog-choice.selected .ms-icon {
            opacity: 1;
        }

        /* 可选勾选框（例如更新提醒里的「永不提醒」）：整行可点，点击文字也能切换 */
        .dialog-checkbox {
            display: flex;
            align-items: flex-start;
            gap: 8px;
            font-size: 12px;
            line-height: 1.6;
            color: var(--text-secondary);
            cursor: pointer;
            user-select: none;
        }
        .dialog-checkbox:hover {
            color: var(--text-primary);
        }
        .dialog-checkbox input {
            width: 14px;
            height: 14px;
            flex-shrink: 0;
            margin-top: 2px;
            accent-color: var(--accent);
            cursor: pointer;
        }

        .dialog-actions {
            display: flex;
            justify-content: flex-end;
            gap: 8px;
        }

        .dialog-btn {
            padding: 6px 14px;
            border-radius: var(--radius-sm);
            font-size: 12px;
            border: 1px solid transparent;
            transition: background 0.15s, opacity 0.15s, color 0.15s;
        }
        .dialog-btn.default {
            color: var(--text-secondary);
        }
        .dialog-btn.default:hover {
            background: var(--item-hover);
            color: var(--text-primary);
        }
        .dialog-btn.primary {
            background: var(--accent);
            color: var(--accent-fg);
        }
        .dialog-btn.danger {
            background: var(--danger);
            color: #ffffff;
        }
        .dialog-btn.primary:hover,
        .dialog-btn.danger:hover {
            opacity: 0.9;
        }

        /* 显隐切换：与主窗口、小本本使用同一个约定 */
        .hidden { display: none !important; }
    </style>
</head>
<body>
    <div class="dialog-container">
        <header class="titlebar" id="dialog-titlebar">
            <div class="titlebar-brand">EsprinNemo</div>
            <div class="titlebar-title" id="dialog-title"></div>
            <div class="window-controls">
                <button class="win-btn close" id="dialog-close" title="关闭">
                    <span class="ms-icon xs">close</span>
                </button>
            </div>
        </header>

        <main class="dialog-body">
            <div class="dialog-head">
                <span class="ms-icon dialog-icon" id="dialog-icon">info</span>
                <div class="dialog-text">
                    <div class="dialog-message" id="dialog-message"></div>
                    <div class="dialog-detail hidden" id="dialog-detail"></div>
                    <div class="dialog-countdown hidden" id="dialog-countdown"></div>
                </div>
            </div>

            <div class="dialog-field hidden" id="dialog-field">
                <span class="dialog-field-label hidden" id="dialog-field-label"></span>
                <input type="text" class="dialog-input" id="dialog-input" spellcheck="false">
                <div class="dialog-choices hidden" id="dialog-choices"></div>
            </div>

            <label class="dialog-checkbox hidden" id="dialog-checkbox-row">
                <input type="checkbox" id="dialog-checkbox">
                <span id="dialog-checkbox-label"></span>
            </label>

            <div class="dialog-actions" id="dialog-actions"></div>
        </main>
    </div>

    <script>
        const { ipcRenderer } = require('electron');

        const titleEl = document.getElementById('dialog-title');
        const iconEl = document.getElementById('dialog-icon');
        const messageEl = document.getElementById('dialog-message');
        const detailEl = document.getElementById('dialog-detail');
        const countdownEl = document.getElementById('dialog-countdown');
        const fieldEl = document.getElementById('dialog-field');
        const fieldLabelEl = document.getElementById('dialog-field-label');
        const inputEl = document.getElementById('dialog-input');
        const choicesEl = document.getElementById('dialog-choices');
        const checkboxRowEl = document.getElementById('dialog-checkbox-row');
        const checkboxEl = document.getElementById('dialog-checkbox');
        const checkboxLabelEl = document.getElementById('dialog-checkbox-label');
        const actionsEl = document.getElementById('dialog-actions');

        // 与主进程 dialog_window.js 的 MAX_HEIGHT 保持一致
        const MAX_CONTENT_HEIGHT = 720;

        let options = null;
        let buttonEls = [];
        let choiceEls = [];
        let selectedChoices = new Set();
        let responded = false;
        let countdownTimer = null;

        // 用纯文本填充，避免消息内容被当作 HTML 解析
        function setText(el, text) {
            el.textContent = text;
        }

        function renderButtons() {
            actionsEl.innerHTML = '';
            buttonEls = options.buttons.map((button, index) => {
                const el = document.createElement('button');
                el.type = 'button';
                el.className = `dialog-btn ${button.variant}`;
                setText(el, button.label);
                el.addEventListener('click', () => respond(index, false));
                actionsEl.appendChild(el);
                return el;
            });
        }

        // 候选项气泡：点击切换选中状态；单选模式（multiple === false）下互斥
        function syncChoices() {
            choiceEls.forEach((el) => {
                el.classList.toggle('selected', selectedChoices.has(el.dataset.value));
            });
        }

        function renderChoices(data) {
            const choices = Array.isArray(data.choices) ? data.choices : [];
            choiceEls = [];
            selectedChoices = new Set(Array.isArray(data.selected) ? data.selected : []);
            if (!choices.length) return;

            choicesEl.classList.remove('hidden');
            choices.forEach((value) => {
                const el = document.createElement('button');
                el.type = 'button';
                el.className = 'dialog-choice';
                el.dataset.value = value;

                const icon = document.createElement('span');
                icon.className = 'ms-icon';
                icon.textContent = 'check';

                const label = document.createElement('span');
                label.textContent = value;

                el.append(icon, label);
                el.addEventListener('click', () => {
                    if (selectedChoices.has(value)) {
                        selectedChoices.delete(value);
                    } else {
                        if (data.multiple === false) selectedChoices.clear();
                        selectedChoices.add(value);
                    }
                    syncChoices();
                });

                choicesEl.appendChild(el);
                choiceEls.push(el);
            });
            syncChoices();
        }

        // 自动关闭倒计时：到点由主进程按「取消」收掉窗口（见 main/dialog_window.js 的 armTimeout）。
        // 这里只把剩余秒数摆在明处，免得弹窗在用户眼前自己消失、看不出发生了什么
        function startCountdown() {
            const total = Number(options && options.timeoutMs) || 0;
            if (total <= 0) return;
            const deadline = Date.now() + total;
            const tick = () => {
                const remain = Math.max(0, Math.ceil((deadline - Date.now()) / 1000));
                setText(countdownEl, `${remain} 秒后将自动关闭`);
                if (remain > 0) countdownTimer = setTimeout(tick, 250);
            };
            countdownEl.classList.remove('hidden');
            tick();
        }

        function render(data) {
            setText(titleEl, data.title || '提示');
            setText(messageEl, data.message);
            messageEl.classList.toggle('hidden', !data.message);

            if (data.detail) {
                setText(detailEl, data.detail);
                detailEl.classList.remove('hidden');
            }

            setText(iconEl, data.icon || 'info');
            iconEl.classList.remove('warning', 'error');
            if (data.type === 'warning') iconEl.classList.add('warning');
            if (data.type === 'error') iconEl.classList.add('error');

            if (data.input) {
                fieldEl.classList.remove('hidden');
                // 口令输入（type: 'password'）同样走这个输入框，只是不显示明文
                inputEl.type = data.input.type === 'password' ? 'password' : 'text';
                inputEl.setAttribute('autocomplete', data.input.type === 'password' ? 'off' : 'on');
                inputEl.value = data.input.value || '';
                inputEl.placeholder = data.input.placeholder || '';
                if (data.input.label) {
                    setText(fieldLabelEl, data.input.label);
                    fieldLabelEl.classList.remove('hidden');
                }
                renderChoices(data.input);
            }

            if (data.checkbox) {
                checkboxEl.checked = !!data.checkbox.checked;
                setText(checkboxLabelEl, data.checkbox.label || '');
                checkboxRowEl.classList.remove('hidden');
            }

            renderButtons();
        }

        function respond(index, dismissed) {
            if (responded || !options) return;
            responded = true;
            if (countdownTimer) {
                clearTimeout(countdownTimer);
                countdownTimer = null;
            }
            const button = options.buttons[index] || options.buttons[options.cancelIndex] || options.buttons[0];
            ipcRenderer.send('dialog:respond', {
                id: button ? button.id : null,
                value: inputEl ? inputEl.value : '',
                selected: Array.from(selectedChoices),
                checked: !!(checkboxRowEl && !checkboxRowEl.classList.contains('hidden') && checkboxEl.checked),
                dismissed: !!dismissed
            });
        }

        // 渲染进程无法直接改窗口大小，量好内容高度后交给主进程调整
        // 内容超过窗口高度上限时改为滚动，避免文字被裁掉
        // 取整时向上进位，避免亚像素高度把最后一行（按钮行）的底部裁掉
        function requestResize() {
            if (responded) return;
            const height = Math.ceil(document.body.getBoundingClientRect().height);
            document.documentElement.style.overflowY = height > MAX_CONTENT_HEIGHT ? 'auto' : 'hidden';
            ipcRenderer.send('dialog:resize', { height });
        }

        function focusTarget() {
            if (responded) return;
            if (options && options.input) {
                inputEl.focus();
                inputEl.select();
                return;
            }
            const target = buttonEls[options ? options.defaultIndex : 0];
            if (target) target.focus();
        }

        document.getElementById('dialog-close').addEventListener('click', () => {
            respond(options ? options.cancelIndex : 0, true);
        });

        document.addEventListener('keydown', (event) => {
            if (!options) return;
            if (event.key === 'Escape') {
                event.preventDefault();
                respond(options.cancelIndex, true);
                return;
            }
            if (event.key === 'Enter' && !event.shiftKey) {
                // 焦点落在按钮/候选项上时交给它们自身的默认行为，避免与预期不一致
                if (document.activeElement && document.activeElement.closest('.dialog-btn, .dialog-choice')) return;
                event.preventDefault();
                respond(options.defaultIndex, false);
            }
        });

        // 输入框里的回车同样触发默认按钮（不依赖表单默认行为）
        inputEl.addEventListener('keydown', (event) => {
            if (event.key === 'Enter') event.preventDefault();
        });

        window.addEventListener('focus', () => focusTarget());

        (async () => {
            try {
                options = await ipcRenderer.invoke('dialog:get-options');
            } catch (err) {
                options = null;
            }
            if (!options) {
                options = {
                    title: '', message: '无法加载弹窗内容', detail: '', type: 'error', icon: 'error',
                    buttons: [{ id: 'ok', label: '确定', variant: 'primary' }], defaultIndex: 0, cancelIndex: 0,
                    input: null, checkbox: null, timeoutMs: 0
                };
            }
            render(options);
            startCountdown();
            requestResize();
            // 图标字体加载完成后高度可能变化，再量一次
            if (document.fonts && document.fonts.ready) {
                document.fonts.ready.then(() => requestResize()).catch(() => {});
            }
            setTimeout(() => {
                requestResize();
                focusTarget();
            }, 60);
        })();
    </script>
</body>
</html>
