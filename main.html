<!DOCTYPE html>
<html lang="zh-CN" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Esprin Nemo - 极简笔记</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Marked.js for Markdown parsing -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/4.3.0/marked.min.js"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        mono: {
                            50: '#f9fafb',
                            100: '#f3f4f6',
                            200: '#e5e7eb',
                            300: '#d1d5db',
                            400: '#9ca3af',
                            500: '#6b7280',
                            600: '#4b5563',
                            700: '#374151',
                            800: '#1f2937',
                            850: '#18202c',
                            900: '#111827',
                            950: '#0b0f17',
                        }
                    },
                    borderRadius: {
                        'nemo': '6px',
                    },
                    boxShadow: {
                        'subtle': '0 1px 2px 0 rgba(0, 0, 0, 0.03), 0 1px 3px 0 rgba(0, 0, 0, 0.02)',
                        'float': '0 4px 12px -2px rgba(0, 0, 0, 0.08), 0 2px 6px -1px rgba(0, 0, 0, 0.04)',
                    }
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap');
        
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        code, textarea#note-content-input {
            font-family: 'JetBrains Mono', monospace;
        }

        /* Subtle scrollbars */
        ::-webkit-scrollbar {
            width: 4px;
            height: 4px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(156, 163, 175, 0.25);
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(156, 163, 175, 0.45);
        }

        /* Strict Minimal Markdown Styles */
        .markdown-body h1 { font-size: 1.65rem; font-weight: 700; margin-top: 1.5rem; margin-bottom: 0.75rem; border-bottom: 1px solid rgba(156, 163, 175, 0.2); padding-bottom: 0.4rem; color: currentColor; }
        .markdown-body h2 { font-size: 1.35rem; font-weight: 600; margin-top: 1.25rem; margin-bottom: 0.5rem; color: currentColor; }
        .markdown-body h3 { font-size: 1.1rem; font-weight: 600; margin-top: 1rem; margin-bottom: 0.375rem; color: currentColor; }
        .markdown-body p { margin-bottom: 0.85rem; line-height: 1.65; opacity: 0.9; }
        .markdown-body ul { list-style-type: disc; padding-left: 1.25rem; margin-bottom: 0.85rem; }
        .markdown-body ol { list-style-type: decimal; padding-left: 1.25rem; margin-bottom: 0.85rem; }
        .markdown-body li { margin-bottom: 0.25rem; }
        .markdown-body blockquote { border-left: 3px solid #6b7280; padding-left: 0.85rem; opacity: 0.8; font-style: italic; margin-bottom: 0.85rem; }
        .markdown-body code:not(pre code) { background-color: rgba(156, 163, 175, 0.15); padding: 0.15rem 0.35rem; border-radius: 4px; font-size: 0.875em; font-family: 'JetBrains Mono', monospace; }
        .markdown-body pre { background-color: #111827; color: #f3f4f6; padding: 1rem; border-radius: 6px; overflow-x: auto; margin-bottom: 1rem; border: 1px solid #1f2937; position: relative; }
        .dark .markdown-body pre { background-color: #0b0f17; border-color: #1f2937; }
        .markdown-body pre code { background-color: transparent; padding: 0; color: inherit; font-size: 0.85rem; }
        .markdown-body a { color: currentColor; text-decoration: underline; text-underline-offset: 3px; opacity: 0.85; }
        .markdown-body a:hover { opacity: 1; }
        .markdown-body table { width: 100%; border-collapse: collapse; margin-bottom: 1rem; font-size: 0.875rem; }
        .markdown-body th, .markdown-body td { border: 1px solid rgba(156, 163, 175, 0.25); padding: 0.5rem 0.75rem; text-align: left; }
        .markdown-body th { background-color: rgba(156, 163, 175, 0.08); font-weight: 600; }
        .markdown-body hr { border: 0; border-top: 1px solid rgba(156, 163, 175, 0.25); margin: 1.5rem 0; }
        .markdown-body input[type="checkbox"] { margin-right: 0.5rem; accent-color: #374151; cursor: pointer; }

        /* Code Copy Button */
        .code-copy-btn {
            position: absolute;
            top: 0.5rem;
            right: 0.5rem;
            padding: 0.25rem 0.5rem;
            font-size: 0.7rem;
            border-radius: 4px;
            background: rgba(255, 255, 255, 0.1);
            color: #d1d5db;
            border: 1px solid rgba(255, 255, 255, 0.15);
            transition: all 0.15s ease;
            cursor: pointer;
        }
        .code-copy-btn:hover {
            background: rgba(255, 255, 255, 0.2);
            color: #fff;
        }

        .transition-fast {
            transition: all 0.15s cubic-bezier(0.4, 0, 0.2, 1);
        }
    </style>
</head>
<body class="bg-mono-50 dark:bg-mono-950 text-mono-800 dark:text-mono-200 h-full flex flex-col overflow-hidden transition-colors duration-200">

    <!-- Top Navigation Bar -->
    <header class="h-12 border-b border-mono-200 dark:border-mono-850 bg-white/90 dark:bg-mono-900/90 backdrop-blur-sm flex items-center justify-between px-3 z-30 shrink-0 select-none">
        <div class="flex items-center space-x-2">
            <button id="btn-toggle-sidebar" class="p-1.5 rounded-nemo hover:bg-mono-100 dark:hover:bg-mono-800 text-mono-600 dark:text-mono-400 transition-fast" title="切换侧边栏 (Alt+S)">
                <i class="fa-solid fa-bars text-sm"></i>
            </button>
            <div class="flex items-center space-x-2">
                <div class="w-5 h-5 rounded-nemo bg-mono-900 dark:bg-mono-100 text-white dark:text-mono-950 flex items-center justify-center font-bold text-xs">
                    N
                </div>
                <span class="font-semibold text-sm tracking-tight text-mono-900 dark:text-mono-100">Esprin Nemo</span>
                <span class="text-[10px] px-1.5 py-0.2 rounded border border-mono-200 dark:border-mono-800 text-mono-500 font-mono">v2.0</span>
            </div>
        </div>

        <div class="flex items-center space-x-1">
            <!-- New Note Quick Button -->
            <button id="btn-top-new" class="flex items-center space-x-1.5 bg-mono-900 dark:bg-mono-100 hover:bg-mono-800 dark:hover:bg-white text-white dark:text-mono-950 px-2.5 py-1 rounded-nemo text-xs font-medium transition-fast shadow-subtle active:scale-98">
                <i class="fa-solid fa-plus text-[10px]"></i>
                <span class="hidden sm:inline">新建笔记</span>
            </button>

            <div class="h-3.5 w-[1px] bg-mono-200 dark:bg-mono-800 mx-1"></div>

            <!-- Import / Export Menu -->
            <button id="btn-export-backup" class="p-1.5 rounded-nemo hover:bg-mono-100 dark:hover:bg-mono-800 text-mono-600 dark:text-mono-400 transition-fast" title="导出 JSON 全量备份">
                <i class="fa-solid fa-download text-xs"></i>
            </button>
            <label class="p-1.5 rounded-nemo hover:bg-mono-100 dark:hover:bg-mono-800 text-mono-600 dark:text-mono-400 transition-fast cursor-pointer" title="导入 JSON 备份数据">
                <i class="fa-solid fa-upload text-xs"></i>
                <input type="file" id="input-import-backup" accept=".json" class="hidden">
            </label>

            <!-- Theme Toggle -->
            <button id="btn-theme-toggle" class="p-1.5 rounded-nemo hover:bg-mono-100 dark:hover:bg-mono-800 text-mono-600 dark:text-mono-400 transition-fast" title="切换深浅主题">
                <i class="fa-solid fa-moon dark:hidden text-xs"></i>
                <i class="fa-solid fa-sun hidden dark:block text-xs"></i>
            </button>

            <!-- Fullscreen -->
            <button id="btn-fullscreen" class="p-1.5 rounded-nemo hover:bg-mono-100 dark:hover:bg-mono-800 text-mono-600 dark:text-mono-400 transition-fast" title="全屏切换">
                <i class="fa-solid fa-expand text-xs"></i>
            </button>
        </div>
    </header>

    <!-- Main Content Grid / Flex Structure -->
    <div class="flex-1 flex overflow-hidden relative">

        <!-- Sidebar Navigation -->
        <aside id="sidebar" class="w-64 border-r border-mono-200 dark:border-mono-850 bg-mono-50/50 dark:bg-mono-900/50 flex flex-col shrink-0 transition-all duration-200 absolute md:relative z-20 h-full shadow-lg md:shadow-none -translate-x-full md:translate-x-0">
            
            <!-- Global Primary Navigation -->
            <div class="p-2 space-y-0.5 border-b border-mono-200/60 dark:border-mono-850/60">
                <button data-filter="all" class="nav-filter-btn w-full flex items-center justify-between px-2.5 py-1.5 rounded-nemo text-xs font-medium text-mono-700 dark:text-mono-300 hover:bg-mono-200/60 dark:hover:bg-mono-800/60 transition-fast">
                    <div class="flex items-center space-x-2">
                        <i class="fa-regular fa-folder text-mono-500"></i>
                        <span>全部笔记</span>
                    </div>
                    <span id="cnt-all" class="text-[10px] bg-mono-200 dark:bg-mono-800 text-mono-600 dark:text-mono-400 px-1.5 py-0.2 rounded-full font-mono">0</span>
                </button>
                
                <button data-filter="pinned" class="nav-filter-btn w-full flex items-center justify-between px-2.5 py-1.5 rounded-nemo text-xs font-medium text-mono-700 dark:text-mono-300 hover:bg-mono-200/60 dark:hover:bg-mono-800/60 transition-fast">
                    <div class="flex items-center space-x-2">
                        <i class="fa-solid fa-thumbtack text-mono-500 text-[11px]"></i>
                        <span>已置顶</span>
                    </div>
                    <span id="cnt-pinned" class="text-[10px] bg-mono-200 dark:bg-mono-800 text-mono-600 dark:text-mono-400 px-1.5 py-0.2 rounded-full font-mono">0</span>
                </button>

                <button data-filter="trash" class="nav-filter-btn w-full flex items-center justify-between px-2.5 py-1.5 rounded-nemo text-xs font-medium text-mono-700 dark:text-mono-300 hover:bg-mono-200/60 dark:hover:bg-mono-800/60 transition-fast">
                    <div class="flex items-center space-x-2">
                        <i class="fa-regular fa-trash-can text-mono-500"></i>
                        <span>废纸篓</span>
                    </div>
                    <span id="cnt-trash" class="text-[10px] bg-mono-200 dark:bg-mono-800 text-mono-600 dark:text-mono-400 px-1.5 py-0.2 rounded-full font-mono">0</span>
                </button>
            </div>

            <!-- Folders Section -->
            <div class="p-2 border-b border-mono-200/60 dark:border-mono-850/60 flex-1 flex flex-col min-h-0">
                <div class="flex items-center justify-between text-[11px] font-semibold text-mono-400 dark:text-mono-500 px-2 mb-1.5 uppercase tracking-wider">
                    <span>文件夹</span>
                    <button id="btn-add-folder" class="hover:text-mono-800 dark:hover:text-mono-200 transition-fast" title="新建文件夹">
                        <i class="fa-solid fa-plus text-[10px]"></i>
                    </button>
                </div>
                <div id="folder-list" class="space-y-0.5 overflow-y-auto pr-1">
                    <!-- Folders rendered dynamically -->
                </div>
            </div>

            <!-- Tag Cloud Section -->
            <div class="p-2 border-b border-mono-200/60 dark:border-mono-850/60 h-32 flex flex-col shrink-0">
                <div class="text-[11px] font-semibold text-mono-400 dark:text-mono-500 px-2 mb-1.5 uppercase tracking-wider">
                    <span>标签过滤</span>
                </div>
                <div id="tag-cloud" class="flex flex-wrap gap-1 overflow-y-auto pr-1">
                    <!-- Dynamic tag list -->
                </div>
            </div>

            <!-- Sidebar Footer Status -->
            <div class="p-2 px-3 text-[11px] text-mono-400 dark:text-mono-500 border-t border-mono-200/60 dark:border-mono-850/60 flex justify-between items-center bg-mono-100/40 dark:bg-mono-900/40">
                <span id="sidebar-footer-stat">共 0 篇笔记</span>
                <button id="btn-empty-trash-sidebar" class="hidden text-mono-500 hover:text-mono-900 dark:hover:text-mono-100 transition-fast" title="清空回收站">
                    <i class="fa-solid fa-broom mr-1"></i>清空
                </button>
            </div>
        </aside>

        <!-- Middle Notes Selection List Panel -->
        <section id="notes-panel" class="w-72 border-r border-mono-200 dark:border-mono-850 bg-white dark:bg-mono-900 flex flex-col shrink-0 transition-all duration-200">
            <!-- Search & Filter Controls Bar -->
            <div class="p-2 border-b border-mono-200/60 dark:border-mono-850/60 space-y-1.5">
                <div class="relative">
                    <i class="fa-solid fa-magnifying-glass absolute left-2.5 top-1/2 -translate-y-1/2 text-mono-400 text-xs"></i>
                    <input type="text" id="search-input" placeholder="搜索标题与内容... (Ctrl+Shift+F)" class="w-full bg-mono-100/80 dark:bg-mono-850/80 text-xs pl-7 pr-6 py-1.5 rounded-nemo border border-transparent focus:border-mono-400 dark:focus:border-mono-600 outline-none transition-fast placeholder:text-mono-400">
                    <button id="btn-clear-search" class="hidden absolute right-2 top-1/2 -translate-y-1/2 text-mono-400 hover:text-mono-600 dark:hover:text-mono-200 text-xs">
                        <i class="fa-solid fa-circle-xmark"></i>
                    </button>
                </div>
                
                <div class="flex items-center justify-between text-[11px] text-mono-500 px-1">
                    <span id="panel-title-label" class="font-medium truncate max-w-[140px]">全部笔记</span>
                    <select id="sort-select" class="bg-transparent text-mono-500 dark:text-mono-400 outline-none cursor-pointer hover:text-mono-800 dark:hover:text-mono-200 transition-fast">
                        <option value="updated-desc">修改时间 ↓</option>
                        <option value="created-desc">创建时间 ↓</option>
                        <option value="title-asc">标题 A-Z</option>
                    </select>
                </div>
            </div>

            <!-- Notes Cards Container -->
            <div id="notes-list-container" class="flex-1 overflow-y-auto p-1.5 space-y-1">
                <!-- Dynamic cards injected here -->
            </div>
        </section>

        <!-- Right Main Workspace -->
        <main id="workspace" class="flex-1 flex flex-col bg-white dark:bg-mono-900 min-w-0 relative">
            
            <!-- Empty State Overlay -->
            <div id="empty-state" class="hidden absolute inset-0 flex flex-col items-center justify-center text-center p-6 z-10 bg-white dark:bg-mono-900 select-none">
                <div class="w-12 h-12 rounded-nemo border border-mono-200 dark:border-mono-800 flex items-center justify-center text-mono-400 text-xl mb-3 shadow-subtle">
                    <i class="fa-regular fa-pen-to-square"></i>
                </div>
                <h3 class="text-sm font-semibold text-mono-700 dark:text-mono-300 mb-1">未选中任何笔记</h3>
                <p class="text-mono-400 dark:text-mono-500 text-xs max-w-xs mb-4">在左侧列表选择笔记，或快捷键 Ctrl+N 新建。</p>
                <button id="btn-empty-create" class="bg-mono-900 dark:bg-mono-100 text-white dark:text-mono-950 px-3 py-1.5 rounded-nemo text-xs font-medium hover:bg-mono-800 dark:hover:bg-white transition-fast">
                    新建第一篇笔记
                </button>
            </div>

            <!-- Note Header Actions & Metadata -->
            <div id="editor-header" class="px-4 py-2 border-b border-mono-200/60 dark:border-mono-850/60 flex flex-wrap items-center justify-between gap-2 shrink-0">
                
                <!-- Left: Folder Dropdown & Tags List -->
                <div class="flex items-center space-x-2 flex-wrap gap-y-1">
                    <!-- Folder Picker -->
                    <div class="relative">
                        <select id="editor-folder-select" class="bg-mono-100 dark:bg-mono-800 text-mono-700 dark:text-mono-300 text-xs font-medium px-2 py-1 rounded-nemo border border-mono-200 dark:border-mono-700/60 outline-none cursor-pointer hover:border-mono-400 transition-fast">
                            <!-- Dynamic Folders -->
                        </select>
                    </div>

                    <!-- Tags list & Add tag button -->
                    <div id="editor-tags-list" class="flex items-center space-x-1 flex-wrap">
                        <!-- Rendered Tags -->
                    </div>
                    <button id="btn-add-tag" class="text-xs text-mono-400 hover:text-mono-700 dark:hover:text-mono-200 px-1 py-0.5 rounded transition-fast" title="添加标签">
                        <i class="fa-solid fa-tag text-[10px]"></i> +
                    </button>
                </div>

                <!-- Right: View Modes & Action Tools -->
                <div class="flex items-center space-x-1">
                    <!-- View Switcher -->
                    <div class="flex bg-mono-100 dark:bg-mono-800 p-0.5 rounded-nemo border border-mono-200/60 dark:border-mono-700/60 text-xs">
                        <button id="mode-edit" class="px-2 py-0.5 rounded font-medium transition-fast" title="纯编辑">编辑</button>
                        <button id="mode-split" class="px-2 py-0.5 rounded font-medium transition-fast hidden sm:block" title="双栏实时预览">分屏</button>
                        <button id="mode-preview" class="px-2 py-0.5 rounded font-medium transition-fast" title="纯预览">预览</button>
                    </div>

                    <div class="h-3.5 w-[1px] bg-mono-200 dark:bg-mono-800 mx-1"></div>

                    <!-- Pin Action -->
                    <button id="btn-action-pin" class="p-1.5 text-mono-400 hover:text-mono-800 dark:hover:text-mono-200 rounded-nemo transition-fast" title="置顶笔记">
                        <i class="fa-solid fa-thumbtack text-xs"></i>
                    </button>

                    <!-- Export Single Note MD -->
                    <button id="btn-action-export-md" class="p-1.5 text-mono-400 hover:text-mono-800 dark:hover:text-mono-200 rounded-nemo transition-fast" title="导出 Markdown (.md)">
                        <i class="fa-solid fa-file-arrow-down text-xs"></i>
                    </button>

                    <!-- Trash Action -->
                    <button id="btn-action-trash" class="p-1.5 text-mono-400 hover:text-mono-800 dark:hover:text-mono-200 rounded-nemo transition-fast" title="放入废纸篓">
                        <i class="fa-regular fa-trash-can text-xs"></i>
                    </button>
                </div>
            </div>

            <!-- Quick Markdown Insertion Formatting Bar -->
            <div id="editor-toolbar" class="px-4 py-1 border-b border-mono-200/40 dark:border-mono-850/40 bg-mono-50/40 dark:bg-mono-900/40 flex items-center space-x-0.5 overflow-x-auto text-mono-600 dark:text-mono-400 shrink-0">
                <button data-fmt="bold" class="fmt-btn px-2 py-1 hover:bg-mono-200 dark:hover:bg-mono-800 rounded text-xs font-bold transition-fast" title="加粗 (Ctrl+B)">B</button>
                <button data-fmt="italic" class="fmt-btn px-2 py-1 hover:bg-mono-200 dark:hover:bg-mono-800 rounded text-xs italic transition-fast" title="斜体 (Ctrl+I)">I</button>
                <div class="h-3 w-[1px] bg-mono-200 dark:bg-mono-800 mx-1"></div>
                <button data-fmt="h1" class="fmt-btn px-2 py-1 hover:bg-mono-200 dark:hover:bg-mono-800 rounded text-xs font-semibold transition-fast">H1</button>
                <button data-fmt="h2" class="fmt-btn px-2 py-1 hover:bg-mono-200 dark:hover:bg-mono-800 rounded text-xs font-semibold transition-fast">H2</button>
                <button data-fmt="h3" class="fmt-btn px-2 py-1 hover:bg-mono-200 dark:hover:bg-mono-800 rounded text-xs font-semibold transition-fast">H3</button>
                <div class="h-3 w-[1px] bg-mono-200 dark:bg-mono-800 mx-1"></div>
                <button data-fmt="ul" class="fmt-btn px-1.5 py-1 hover:bg-mono-200 dark:hover:bg-mono-800 rounded text-xs transition-fast" title="无序列表"><i class="fa-solid fa-list-ul"></i></button>
                <button data-fmt="ol" class="fmt-btn px-1.5 py-1 hover:bg-mono-200 dark:hover:bg-mono-800 rounded text-xs transition-fast" title="有序列表"><i class="fa-solid fa-list-ol"></i></button>
                <button data-fmt="task" class="fmt-btn px-1.5 py-1 hover:bg-mono-200 dark:hover:bg-mono-800 rounded text-xs transition-fast" title="任务清单"><i class="fa-regular fa-square-check"></i></button>
                <button data-fmt="quote" class="fmt-btn px-1.5 py-1 hover:bg-mono-200 dark:hover:bg-mono-800 rounded text-xs transition-fast" title="引用块"><i class="fa-solid fa-quote-left"></i></button>
                <button data-fmt="code" class="fmt-btn px-1.5 py-1 hover:bg-mono-200 dark:hover:bg-mono-800 rounded text-xs transition-fast" title="代码块"><i class="fa-solid fa-code"></i></button>
                <button data-fmt="link" class="fmt-btn px-1.5 py-1 hover:bg-mono-200 dark:hover:bg-mono-800 rounded text-xs transition-fast" title="插入链接"><i class="fa-solid fa-link"></i></button>
                <button data-fmt="hr" class="fmt-btn px-1.5 py-1 hover:bg-mono-200 dark:hover:bg-mono-800 rounded text-xs transition-fast" title="分割线"><i class="fa-solid fa-minus"></i></button>
            </div>

            <!-- Note Title Line -->
            <div class="px-6 pt-4 pb-2 shrink-0">
                <input type="text" id="note-title-input" placeholder="无标题笔记..." class="w-full text-xl font-bold bg-transparent border-none outline-none text-mono-900 dark:text-mono-100 placeholder:text-mono-300 dark:placeholder:text-mono-700 tracking-tight">
            </div>

            <!-- Main Content Area: Editor & Preview Containers -->
            <div class="flex-1 flex min-h-0 relative">
                
                <!-- Editor Box -->
                <div id="editor-box" class="flex-1 h-full p-6 pt-1">
                    <textarea id="note-content-input" placeholder="在此输入 Markdown 正文..." class="w-full h-full bg-transparent border-none outline-none resize-none text-mono-800 dark:text-mono-200 leading-relaxed text-sm placeholder:text-mono-300 dark:placeholder:text-mono-700"></textarea>
                </div>

                <!-- Preview Box -->
                <div id="preview-box" class="hidden flex-1 h-full p-6 pt-1 overflow-y-auto border-l border-mono-200/60 dark:border-mono-850/60 bg-mono-50/20 dark:bg-mono-950/20">
                    <div id="markdown-preview" class="markdown-body text-mono-800 dark:text-mono-200 text-sm">
                        <!-- Preview content -->
                    </div>
                </div>

            </div>

            <!-- Footer Stats & Auto-save Status Indicator -->
            <div class="px-6 py-1.5 border-t border-mono-200/60 dark:border-mono-850/60 bg-white dark:bg-mono-900 text-[11px] text-mono-400 dark:text-mono-500 flex items-center justify-between shrink-0 select-none">
                <div class="flex items-center space-x-3">
                    <span id="save-status-indicator" class="flex items-center space-x-1.5">

                <button id="btn-confirm-tag" class="px-2.5 py-1 text-xs bg-mono-900 dark:bg-mono-100 text-white dark:text-mono-950 rounded-nemo font-medium transition-fast">确定</button>

        <div class="bg-white dark:bg-mono-850 rounded-nemo shadow-float w-full max-w-xs p-4 space-y-3 border border-mono-200 dark:border-mono-700">

            <input type="text" id="input-folder-name" placeholder="文件夹名称..." class="w-full bg-mono-100 dark:bg-mono-900 border border-mono-200 dark:border-mono-700 rounded-nemo px-2.5 py-1.5 text-xs outline-none focus:border-mono-500">
            <div class="flex justify-end space-x-1.5">
                <button id="btn-cancel-folder" class="px-2.5 py-1 text-xs text-mono-500 hover:bg-mono-100 dark:hover:bg-mono-800 rounded-nemo transition-fast">取消</button>
                <button id="btn-confirm-folder" class="px-2.5 py-1 text-xs bg-mono-900 dark:bg-mono-100 text-white dark:text-mono-950 rounded-nemo font-medium transition-fast">创建</button>

    <!-- Toast Floating Overlay Container -->
    <div id="toast-container" class="fixed bottom-4 right-4 z-50 flex flex-col space-y-1.5 pointer-events-none"></div>

    <script>
        /**
         * Esprin Nemo - Core Application Engine
         * Built with pure JavaScript, self-contained architecture.
         */

        const WELCOME_NOTE = {
            id: 'nemo_welcome_note',
            title: '欢迎使用 Esprin Nemo 极简笔记 ✦',
            content: `# Esprin Nemo 极简笔记指南

**Esprin Nemo** 是一款去除所有花哨色彩、专注于沉浸式表达的高质感 Markdown 笔记应用。

---

### 💡 核心设计与功能特性：

1. **绝对极简冷灰调**
   - 采用低饱和单色系界面，支持随系统或手动**深浅色**无缝切换。

2. **完整 Markdown 支持**
   - 实时预览与交互式任务列表：
     - [x] 代码块带有**一键复制**功能
     - [x] 支持粗体、斜体、标题、表格、引用块
     - [ ] 支持按快捷键快速排版

3. **快捷键一览**
   - \`Cmd / Ctrl + S\`：手动保存笔记
   - \`Cmd / Ctrl + N\`：新建笔记
   - \`Cmd / Ctrl + Shift + F\`：快速聚焦搜索框
   - \`Cmd / Ctrl + P\`：快速切换预览模式

4. **数据安全与备份**
   - 所有数据存于浏览器 \`LocalStorage\`。
   - 支持全量导出与导入恢复 JSON 配置文件。

\`\`\`javascript
// 简单优雅的逻辑结构
const memo = {
    minimal: true,
    speed: "ultra-fast",
    focus: 100
};
console.log("Welcome to Esprin Nemo");
\`\`\`

> *“设计不是关于添加东西，而是关于去掉多余的部分。”*
`,
            folder: '默认',
            tags: ['指南', '欢迎'],
            isPinned: true,
            isTrashed: false,
            createdAt: Date.now(),
            updatedAt: Date.now()
        };

        // Application State StateManager
        const State = {
            notes: [],
            folders: ['默认', '工作', '思考', '归档'],
            activeNoteId: null,
            currentFilter: 'all', // 'all', 'pinned', 'trash', 'folder:[name]', 'tag:[name]'
            searchQuery: '',
            sortBy: 'updated-desc',
            viewMode: 'edit', // 'edit', 'split', 'preview'
            darkMode: false,
            autoSaveTimer: null
        };

        // DOM Element Caching
        const $ = id => document.getElementById(id);
        const DOM = {
            sidebar: $('sidebar'),
            btnToggleSidebar: $('btn-toggle-sidebar'),
            btnThemeToggle: $('btn-theme-toggle'),
            btnTopNew: $('btn-top-new'),
            btnExportBackup: $('btn-export-backup'),
            inputImportBackup: $('input-import-backup'),
            btnFullscreen: $('btn-fullscreen'),
            
            // Sidebar Navigation
            folderList: $('folder-list'),
            tagCloud: $('tag-cloud'),
            cntAll: $('cnt-all'),
            cntPinned: $('cnt-pinned'),
            cntTrash: $('cnt-trash'),
            sidebarFooterStat: $('sidebar-footer-stat'),
            btnEmptyTrashSidebar: $('btn-empty-trash-sidebar'),
            btnAddFolder: $('btn-add-folder'),

            // Notes List Panel
            searchInput: $('search-input'),
            btnClearSearch: $('btn-clear-search'),
            panelTitleLabel: $('panel-title-label'),
            sortSelect: $('sort-select'),
            notesListContainer: $('notes-list-container'),

            // Workspace & Editor
            emptyState: $('empty-state'),
            btnEmptyCreate: $('btn-empty-create'),
            editorFolderSelect: $('editor-folder-select'),
            editorTagsList: $('editor-tags-list'),
            btnAddTag: $('btn-add-tag'),
            
            // View Switcher Buttons
            modeEdit: $('mode-edit'),
            modeSplit: $('mode-split'),
            modePreview: $('mode-preview'),

            // Action Buttons
            btnActionPin: $('btn-action-pin'),
            btnActionExportMd: $('btn-action-export-md'),
            btnActionTrash: $('btn-action-trash'),

            // Editor Text Inputs
            noteTitleInput: $('note-title-input'),
            noteContentInput: $('note-content-input'),
            editorBox: $('editor-box'),
            previewBox: $('preview-box'),
            markdownPreview: $('markdown-preview'),

            // Footer Status
            saveStatusIndicator: $('save-status-indicator'),
            statLastEdited: $('stat-last-edited'),
            statChars: $('stat-chars'),
            statWords: $('stat-words'),
            statReadtime: $('stat-readtime'),

            // Modals
            modalTag: $('modal-tag'),
            inputTagName: $('input-tag-name'),
            btnCancelTag: $('btn-cancel-tag'),
            btnConfirmTag: $('btn-confirm-tag'),

            modalFolder: $('modal-folder'),
            inputFolderName: $('input-folder-name'),
            btnCancelFolder: $('btn-cancel-folder'),
            btnConfirmFolder: $('btn-confirm-folder'),
            toastContainer: $('toast-container')
        };

        // --- LocalStorage Operations ---
        function loadStateFromStorage() {
            try {
                const savedNotes = localStorage.getItem('esprin_nemo_notes');
                const savedFolders = localStorage.getItem('esprin_nemo_folders');
                const savedTheme = localStorage.getItem('esprin_nemo_theme');

                if (savedNotes) {
                    State.notes = JSON.parse(savedNotes);
                } else {
                    State.notes = [WELCOME_NOTE];
                }

                if (savedFolders) {
                    State.folders = JSON.parse(savedFolders);
                }

                if (savedTheme === 'dark' || (!savedTheme && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                    State.darkMode = true;
                    document.documentElement.classList.add('dark');
                } else {
                    State.darkMode = false;
                    document.documentElement.classList.remove('dark');
                }
            } catch (err) {
                console.error("Storage Load Error:", err);
                State.notes = [WELCOME_NOTE];
            }
        }

        function saveNotesToStorage() {
            localStorage.setItem('esprin_nemo_notes', JSON.stringify(State.notes));
        }

        function saveFoldersToStorage() {
            localStorage.setItem('esprin_nemo_folders', JSON.stringify(State.folders));
        }

        function saveThemeToStorage() {
            localStorage.setItem('esprin_nemo_theme', State.darkMode ? 'dark' : 'light');
        }

        // --- Note CRUD Operations ---
        function createNewNote() {
            const currentFolder = State.currentFilter.startsWith('folder:') 
                ? State.currentFilter.replace('folder:', '') 
                : '默认';

            const newNote = {
                id: 'note_' + Date.now() + '_' + Math.random().toString(36).substring(2, 6),
                title: '',
                content: '',
                folder: currentFolder,
                tags: State.currentFilter.startsWith('tag:') ? [State.currentFilter.replace('tag:', '')] : [],
                isPinned: false,
                isTrashed: false,
                createdAt: Date.now(),
                updatedAt: Date.now()
            };

            State.notes.unshift(newNote);
            State.activeNoteId = newNote.id;
            saveNotesToStorage();
            renderApp();

            setTimeout(() => {
                DOM.noteTitleInput.focus();
            }, 50);

            showToast('已新建笔记', 'info');
        }

        function getActiveNote() {
            return State.notes.find(n => n.id === State.activeNoteId);
        }

        function handleAutoSave() {
            updateSaveIndicator('saving');
            clearTimeout(State.autoSaveTimer);
            State.autoSaveTimer = setTimeout(() => {
                const note = getActiveNote();
                if (!note) return;

                note.title = DOM.noteTitleInput.value;
                note.content = DOM.noteContentInput.value;
                note.updatedAt = Date.now();

                saveNotesToStorage();
                renderNotesList(); // Live update card in panel
                updateFooterStats();
                updateSaveIndicator('saved');
            }, 400);
        }

        function togglePinNote(id) {
            const note = State.notes.find(n => n.id === id);
            if (!note) return;

            note.isPinned = !note.isPinned;
            saveNotesToStorage();
            renderApp();
            showToast(note.isPinned ? '已固定笔记' : '已取消固定', 'info');
        }

        function toggleTrashNote(id) {
            const note = State.notes.find(n => n.id === id);
            if (!note) return;

            note.isTrashed = !note.isTrashed;
            saveNotesToStorage();

            if (State.activeNoteId === id) {
                const remaining = getFilteredNotes();
                State.activeNoteId = remaining.length > 0 ? remaining[0].id : null;
            }

            renderApp();
            showToast(note.isTrashed ? '已移入回收站' : '已恢复笔记', 'info');
        }

        function permanentlyDeleteNote(id) {
            State.notes = State.notes.filter(n => n.id !== id);
            saveNotesToStorage();

            if (State.activeNoteId === id) {
                const remaining = getFilteredNotes();
                State.activeNoteId = remaining.length > 0 ? remaining[0].id : null;
            }

            renderApp();
            showToast('已彻底删除笔记', 'warning');
        }

        function emptyTrash() {
            if (confirm('确定要彻底清空废纸篓中的所有笔记吗？此操作无法撤销。')) {
                State.notes = State.notes.filter(n => !n.isTrashed);
                saveNotesToStorage();
                renderApp();
                showToast('已清空废纸篓', 'info');
            }
        }

        // --- Filtering and Sorting ---
        function getFilteredNotes() {
            return State.notes.filter(note => {
                // Filter Categories
                if (State.currentFilter === 'trash') {
                    if (!note.isTrashed) return false;
                } else {
                    if (note.isTrashed) return false;

                    if (State.currentFilter === 'pinned' && !note.isPinned) return false;
                    if (State.currentFilter.startsWith('folder:')) {
                        const targetFolder = State.currentFilter.replace('folder:', '');
                        if (note.folder !== targetFolder) return false;
                    }
                    if (State.currentFilter.startsWith('tag:')) {
                        const targetTag = State.currentFilter.replace('tag:', '');
                        if (!note.tags || !note.tags.includes(targetTag)) return false;
                    }
                }

                // Text Search Query
                if (State.searchQuery.trim() !== '') {
                    const q = State.searchQuery.toLowerCase();
                    const titleMatch = (note.title || '').toLowerCase().includes(q);
                    const contentMatch = (note.content || '').toLowerCase().includes(q);
                    return titleMatch || contentMatch;
                }

                return true;
            }).sort((a, b) => {
                // Pinned notes priority
                if (State.currentFilter !== 'trash') {
                    if (a.isPinned && !b.isPinned) return -1;
                    if (!a.isPinned && b.isPinned) return 1;
                }

                if (State.sortBy === 'updated-desc') return b.updatedAt - a.updatedAt;
                if (State.sortBy === 'created-desc') return b.createdAt - a.createdAt;
                if (State.sortBy === 'title-asc') return (a.title || '未命名').localeCompare(b.title || '未命名', 'zh-CN');
                return 0;
            });
        }

        // --- Rendering Core UI ---
        function renderApp() {
            renderNavCounts();
            renderFolderList();
            renderTagCloud();
            renderNotesList();
            renderWorkspace();
        }

        function renderNavCounts() {
            const activeNotes = State.notes.filter(n => !n.isTrashed);
            DOM.cntAll.textContent = activeNotes.length;
            DOM.cntPinned.textContent = activeNotes.filter(n => n.isPinned).length;
            DOM.cntTrash.textContent = State.notes.filter(n => n.isTrashed).length;
            DOM.sidebarFooterStat.textContent = `共 ${activeNotes.length} 篇笔记`;

            // Active nav button highlights
            document.querySelectorAll('.nav-filter-btn').forEach(btn => {
                const filter = btn.getAttribute('data-filter');
                if (filter === State.currentFilter) {
                    btn.classList.add('bg-mono-200', 'dark:bg-mono-800', 'text-mono-900', 'dark:text-mono-100');
                } else {
                    btn.classList.remove('bg-mono-200', 'dark:bg-mono-800', 'text-mono-900', 'dark:text-mono-100');
                }
            });

            if (State.currentFilter === 'trash') {
                DOM.btnEmptyTrashSidebar.classList.remove('hidden');
                DOM.panelTitleLabel.textContent = '废纸篓';
            } else {
                DOM.btnEmptyTrashSidebar.classList.add('hidden');
                if (State.currentFilter === 'all') DOM.panelTitleLabel.textContent = '全部笔记';
                else if (State.currentFilter === 'pinned') DOM.panelTitleLabel.textContent = '已置顶笔记';
                else if (State.currentFilter.startsWith('folder:')) DOM.panelTitleLabel.textContent = '目录: ' + State.currentFilter.replace('folder:', '');
                else if (State.currentFilter.startsWith('tag:')) DOM.panelTitleLabel.textContent = '标签: #' + State.currentFilter.replace('tag:', '');
            }
        }

        function renderFolderList() {
            DOM.folderList.innerHTML = '';
            State.folders.forEach(folder => {
                const isSelected = State.currentFilter === `folder:${folder}`;
                const div = document.createElement('div');
                div.className = `group flex items-center justify-between px-2 py-1 rounded-nemo text-xs cursor-pointer transition-fast ${
                    isSelected 
                        ? 'bg-mono-200 dark:bg-mono-800 text-mono-900 dark:text-mono-100 font-medium' 
                        : 'text-mono-600 dark:text-mono-400 hover:bg-mono-200/50 dark:hover:bg-mono-800/50'
                }`;

                div.innerHTML = `
                    <div class="flex items-center space-x-2 truncate">
                        <i class="fa-regular fa-folder text-mono-400 text-[11px]"></i>
                        <span class="truncate">${escapeHTML(folder)}</span>
                    </div>
                    ${folder !== '默认' ? `
                        <button class="btn-del-folder text-mono-400 hover:text-mono-900 dark:hover:text-mono-100 opacity-0 group-hover:opacity-100 p-0.5" data-folder="${escapeHTML(folder)}" title="删除文件夹">
                            <i class="fa-solid fa-xmark text-[10px]"></i>
                        </button>
                    ` : ''}
                `;

                div.addEventListener('click', (e) => {
                    if (e.target.closest('.btn-del-folder')) return;
                    State.currentFilter = `folder:${folder}`;
                    renderApp();
                });

                DOM.folderList.appendChild(div);
            });

            // Bind delete folder event
            document.querySelectorAll('.btn-del-folder').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const folderName = btn.getAttribute('data-folder');
                    if (confirm(`确定删除文件夹 "${folderName}" 吗？其内部笔记将移动至"默认"目录。`)) {
                        State.folders = State.folders.filter(f => f !== folderName);
                        State.notes.forEach(n => {
                            if (n.folder === folderName) n.folder = '默认';
                        });
                        saveFoldersToStorage();
                        saveNotesToStorage();
                        if (State.currentFilter === `folder:${folderName}`) State.currentFilter = 'all';
                        renderApp();
                    }
                });
            });
        }

        function renderTagCloud() {
            DOM.tagCloud.innerHTML = '';
            const tagSet = new Set();
            State.notes.filter(n => !n.isTrashed).forEach(n => {
                if (n.tags) n.tags.forEach(t => tagSet.add(t));
            });

            if (tagSet.size === 0) {
                DOM.tagCloud.innerHTML = `<span class="text-[11px] text-mono-400 italic px-1">无关联标签</span>`;
                return;
            }

            tagSet.forEach(tag => {
                const isSelected = State.currentFilter === `tag:${tag}`;
                const span = document.createElement('span');
                span.className = `px-2 py-0.5 text-[11px] rounded border transition-fast cursor-pointer ${
                    isSelected 
                        ? 'bg-mono-900 dark:bg-mono-100 text-white dark:text-mono-950 border-mono-900 dark:border-mono-100 font-medium' 
                        : 'border-mono-200 dark:border-mono-800 text-mono-600 dark:text-mono-400 hover:border-mono-400'
                }`;
                span.textContent = `#${tag}`;
                span.addEventListener('click', () => {
                    State.currentFilter = isSelected ? 'all' : `tag:${tag}`;
                    renderApp();
                });
                DOM.tagCloud.appendChild(span);
            });
        }

        function renderNotesList() {
            const filtered = getFilteredNotes();
            DOM.notesListContainer.innerHTML = '';

            if (filtered.length === 0) {
                DOM.notesListContainer.innerHTML = `
                    <div class="text-center py-12 px-4 text-mono-400">
                        <i class="fa-regular fa-note-sticky text-xl mb-1.5 opacity-60"></i>
                        <p class="text-xs">无匹配笔记</p>
                    </div>
                `;
                return;
            }

            filtered.forEach(note => {
                const isActive = note.id === State.activeNoteId;
                const card = document.createElement('div');
                card.className = `p-2.5 rounded-nemo cursor-pointer transition-fast border ${
                    isActive 
                        ? 'bg-mono-100 dark:bg-mono-800/90 border-mono-300 dark:border-mono-700 shadow-subtle' 
                        : 'bg-white dark:bg-mono-900 border-mono-200/60 dark:border-mono-850 hover:border-mono-300 dark:hover:border-mono-800'
                }`;

                const summary = note.content ? note.content.replace(/[#*`~>-]/g, '').slice(0, 50) : '无附加内容';
                const dateStr = formatDate(note.updatedAt);

                card.innerHTML = `
                    <div class="flex items-start justify-between gap-1 mb-1">
                        <h4 class="text-xs font-semibold text-mono-900 dark:text-mono-100 truncate flex-1">
                            ${note.isPinned ? '<i class="fa-solid fa-thumbtack text-[10px] mr-1 text-mono-500"></i>' : ''}
                            ${escapeHTML(note.title) || '未命名笔记'}
                        </h4>
                    </div>
                    <p class="text-[11px] text-mono-500 dark:text-mono-400 line-clamp-2 leading-relaxed mb-1.5 font-normal">
                        ${escapeHTML(summary)}
                    </p>
                    <div class="flex items-center justify-between text-[10px] text-mono-400 font-mono">
                        <span>${dateStr}</span>
                        <div class="flex items-center space-x-1">
                            <span class="bg-mono-100 dark:bg-mono-800 px-1.5 py-0.2 rounded text-[10px] text-mono-500">${escapeHTML(note.folder)}</span>
                            ${note.isTrashed ? `
                                <button class="btn-restore hover:text-mono-900 dark:hover:text-mono-100 p-0.5" title="恢复" data-id="${note.id}">
                                    <i class="fa-solid fa-rotate-left"></i>
                                </button>
                                <button class="btn-perm-del hover:text-mono-900 dark:hover:text-mono-100 p-0.5" title="彻底删除" data-id="${note.id}">
                                    <i class="fa-solid fa-xmark"></i>
                                </button>
                            ` : ''}
                        </div>
                    </div>
                `;

                card.addEventListener('click', (e) => {
                    if (e.target.closest('.btn-restore') || e.target.closest('.btn-perm-del')) return;
                    State.activeNoteId = note.id;
                    renderApp();
                });

                DOM.notesListContainer.appendChild(card);
            });

            // Trash action listeners
            document.querySelectorAll('.btn-restore').forEach(b => {
                b.addEventListener('click', (e) => {
                    e.stopPropagation();
                    toggleTrashNote(b.getAttribute('data-id'));
                });
            });

            document.querySelectorAll('.btn-perm-del').forEach(b => {
                b.addEventListener('click', (e) => {
                    e.stopPropagation();
                    permanentlyDeleteNote(b.getAttribute('data-id'));
                });
            });
        }

        function renderWorkspace() {
            const note = getActiveNote();

            if (!note) {
                DOM.emptyState.classList.remove('hidden');
                return;
            }

            DOM.emptyState.classList.add('hidden');

            // Synchronize Input Fields
            if (DOM.noteTitleInput.value !== note.title && document.activeElement !== DOM.noteTitleInput) {
                DOM.noteTitleInput.value = note.title;
            }
            if (DOM.noteContentInput.value !== note.content && document.activeElement !== DOM.noteContentInput) {
                DOM.noteContentInput.value = note.content;
            }

            // Pin State Icon
            if (note.isPinned) {
                DOM.btnActionPin.classList.add('text-mono-900', 'dark:text-mono-100');
                DOM.btnActionPin.classList.remove('text-mono-400');
            } else {
                DOM.btnActionPin.classList.remove('text-mono-900', 'dark:text-mono-100');
                DOM.btnActionPin.classList.add('text-mono-400');
            }

            // Folder Select Options
            DOM.editorFolderSelect.innerHTML = '';
            State.folders.forEach(f => {
                const opt = document.createElement('option');
                opt.value = f;
                opt.textContent = f;
                if (f === note.folder) opt.selected = true;
                DOM.editorFolderSelect.appendChild(opt);
            });

            // Tags List
            DOM.editorTagsList.innerHTML = '';
            if (note.tags) {
                note.tags.forEach(tag => {
                    const tagEl = document.createElement('span');
                    tagEl.className = 'inline-flex items-center space-x-1 text-[11px] bg-mono-100 dark:bg-mono-800 text-mono-700 dark:text-mono-300 px-1.5 py-0.5 rounded border border-mono-200/60 dark:border-mono-700/60';
                    tagEl.innerHTML = `
                        <span>#${escapeHTML(tag)}</span>
                        <button class="btn-remove-tag hover:text-mono-900 dark:hover:text-mono-100 ml-1 text-[10px]" data-tag="${escapeHTML(tag)}">&times;</button>
                    `;
                    DOM.editorTagsList.appendChild(tagEl);
                });
            }

            // Remove tag listener
            document.querySelectorAll('.btn-remove-tag').forEach(b => {
                b.addEventListener('click', () => {
                    const t = b.getAttribute('data-tag');
                    note.tags = note.tags.filter(item => item !== t);
                    saveNotesToStorage();
                    renderApp();
                });
            });

            renderMarkdown();
            updateFooterStats();
            updateViewModeUI();
        }

        // --- Markdown Engine ---
        function renderMarkdown() {
            const note = getActiveNote();
            if (!note) return;

            const html = marked.parse(note.content || '*空笔记*');
            DOM.markdownPreview.innerHTML = html;

            // Add Copy Buttons to Code Blocks
            DOM.markdownPreview.querySelectorAll('pre').forEach(pre => {
                if (pre.querySelector('.code-copy-btn')) return;
                const copyBtn = document.createElement('button');
                copyBtn.className = 'code-copy-btn';
                copyBtn.textContent = '复制';
                copyBtn.addEventListener('click', () => {
                    const codeText = pre.querySelector('code')?.innerText || pre.innerText;
                    navigator.clipboard.writeText(codeText).then(() => {
                        copyBtn.textContent = '已复制!';
                        setTimeout(() => copyBtn.textContent = '复制', 1500);
                    });
                });
                pre.appendChild(copyBtn);
            });

            // Interactive Task Checkboxes
            DOM.markdownPreview.querySelectorAll('input[type="checkbox"]').forEach((checkbox, index) => {
                checkbox.removeAttribute('disabled');
                checkbox.addEventListener('change', () => {
                    let taskIndex = 0;
                    const updatedContent = note.content.replace(/(- \[ ]|- \[x])/gi, (match) => {
                        if (taskIndex === index) {
                            taskIndex++;
                            return checkbox.checked ? '- [x]' : '- [ ]';
                        }
                        taskIndex++;
                        return match;
                    });
                    note.content = updatedContent;
                    DOM.noteContentInput.value = updatedContent;
                    handleAutoSave();
                });
            });
        }

        function updateFooterStats() {
            const note = getActiveNote();
            if (!note) return;

            const text = note.content || '';
            const chars = text.length;
            const words = text.trim() ? text.trim().split(/\s+/).length : 0;
            const readTime = Math.max(1, Math.ceil(words / 200));

            DOM.statChars.textContent = `字符: ${chars}`;
            DOM.statWords.textContent = `词数: ${words}`;
            DOM.statReadtime.textContent = `预计阅读: ${readTime}分`;
            DOM.statLastEdited.textContent = `修改于 ${formatDate(note.updatedAt)}`;
        }

        function updateSaveIndicator(status) {
            if (status === 'saving') {
                DOM.saveStatusIndicator.innerHTML = `<span class="w-1.5 h-1.5 rounded-full bg-mono-400 animate-ping"></span><span>保存中...</span>`;
            } else if (status === 'saved') {
                DOM.saveStatusIndicator.innerHTML = `<span class="w-1.5 h-1.5 rounded-full bg-mono-700 dark:bg-mono-300"></span><span>已保存</span>`;
            }
        }

        function updateViewModeUI() {
            const m = State.viewMode;
            [DOM.modeEdit, DOM.modeSplit, DOM.modePreview].forEach(b => {
                b.classList.remove('bg-white', 'dark:bg-mono-700', 'text-mono-900', 'dark:text-mono-100', 'shadow-subtle');
                b.classList.add('text-mono-500');
            });

            if (m === 'edit') {
                DOM.modeEdit.classList.add('bg-white', 'dark:bg-mono-700', 'text-mono-900', 'dark:text-mono-100', 'shadow-subtle');
                DOM.editorBox.classList.remove('hidden');
                DOM.previewBox.classList.add('hidden');
            } else if (m === 'split') {
                DOM.modeSplit.classList.add('bg-white', 'dark:bg-mono-700', 'text-mono-900', 'dark:text-mono-100', 'shadow-subtle');
                DOM.editorBox.classList.remove('hidden');
                DOM.previewBox.classList.remove('hidden');
            } else if (m === 'preview') {
                DOM.modePreview.classList.add('bg-white', 'dark:bg-mono-700', 'text-mono-900', 'dark:text-mono-100', 'shadow-subtle');
                DOM.editorBox.classList.add('hidden');
                DOM.previewBox.classList.remove('hidden');
            }
        }

        // --- Formatting Insertion ---
        function insertFormatting(type) {
            const textarea = DOM.noteContentInput;
            const start = textarea.selectionStart;
            const end = textarea.selectionEnd;
            const text = textarea.value;
            const sel = text.substring(start, end);

            let sub = '';
            switch (type) {
                case 'bold': sub = `**${sel || '粗体文本'}**`; break;
                case 'italic': sub = `*${sel || '斜体文本'}*`; break;
                case 'h1': sub = `# ${sel || '一级标题'}`; break;
                case 'h2': sub = `## ${sel || '二级标题'}`; break;
                case 'h3': sub = `### ${sel || '三级标题'}`; break;
                case 'ul': sub = `- ${sel || '列表项'}`; break;
                case 'ol': sub = `1. ${sel || '列表项'}`; break;
                case 'task': sub = `- [ ] ${sel || '待办任务'}`; break;
                case 'quote': sub = `> ${sel || '引用块'}`; break;
                case 'code': sub = `\`\`\`javascript\n${sel || '// 代码块'}\n\`\`\``; break;
                case 'link': sub = `[${sel || '链接说明'}](https://)`; break;
                case 'hr': sub = `\n---\n`; break;
            }

            textarea.value = text.substring(0, start) + sub + text.substring(end);
            textarea.focus();
            
            handleAutoSave();
            renderMarkdown();
        }

        // --- Event Listener Registration ---
        function setupEventListeners() {
            // New Note Clicks
            DOM.btnTopNew.addEventListener('click', createNewNote);
            DOM.btnEmptyCreate.addEventListener('click', createNewNote);

            // Inputs Sync
            DOM.noteTitleInput.addEventListener('input', handleAutoSave);
            DOM.noteContentInput.addEventListener('input', () => {
                handleAutoSave();
                renderMarkdown();
            });

            // Folder Assignment
            DOM.editorFolderSelect.addEventListener('change', (e) => {
                const note = getActiveNote();
                if (note) {
                    note.folder = e.target.value;
                    saveNotesToStorage();
                    renderApp();
                }
            });

            // Action Buttons
            DOM.btnActionPin.addEventListener('click', () => {
                if (State.activeNoteId) togglePinNote(State.activeNoteId);
            });

            DOM.btnActionTrash.addEventListener('click', () => {
                if (State.activeNoteId) toggleTrashNote(State.activeNoteId);
            });

            DOM.btnEmptyTrashSidebar.addEventListener('click', emptyTrash);

            // Export Single Markdown File
            DOM.btnActionExportMd.addEventListener('click', () => {
                const note = getActiveNote();
                if (!note) return;
                const blob = new Blob([note.content], { type: 'text/markdown;charset=utf-8' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `${note.title || 'Untitled'}.md`;
                a.click();
                URL.revokeObjectURL(url);
                showToast('已导出 Markdown 文件', 'info');
            });

            // Export Full JSON Backup
            DOM.btnExportBackup.addEventListener('click', () => {
                const data = {
                    app: 'Esprin Nemo',
                    version: '2.0',
                    exportedAt: new Date().toISOString(),
                    notes: State.notes,
                    folders: State.folders
                };
                const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `esprin_nemo_backup_${new Date().toISOString().slice(0, 10)}.json`;
                a.click();
                URL.revokeObjectURL(url);
                showToast('已完成全量 JSON 备份', 'info');
            });

            // Import JSON Backup
            DOM.inputImportBackup.addEventListener('change', (e) => {
                const file = e.target.files[0];
                if (!file) return;

                const reader = new FileReader();
                reader.onload = (evt) => {
                    try {
                        const parsed = JSON.parse(evt.target.result);
                        if (parsed && Array.isArray(parsed.notes)) {
                            State.notes = parsed.notes;
                            if (Array.isArray(parsed.folders)) State.folders = parsed.folders;
                            saveNotesToStorage();
                            saveFoldersToStorage();
                            State.activeNoteId = State.notes.length > 0 ? State.notes[0].id : null;
                            renderApp();
                            showToast('备份导入成功！', 'info');
                        } else {
                            showToast('解析失败：无效的备份格式', 'warning');
                        }
                    } catch (err) {
                        showToast('导入失败，文件非有效 JSON', 'warning');
                    }
                };
                reader.readAsText(file);
                e.target.value = '';
            });

            // View Modes Switch
            DOM.modeEdit.addEventListener('click', () => { State.viewMode = 'edit'; updateViewModeUI(); });
            DOM.modeSplit.addEventListener('click', () => { State.viewMode = 'split'; updateViewModeUI(); });
            DOM.modePreview.addEventListener('click', () => { State.viewMode = 'preview'; updateViewModeUI(); });

            // Navigation Filter Buttons
            document.querySelectorAll('.nav-filter-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    State.currentFilter = btn.getAttribute('data-filter');
                    renderApp();
                });
            });

            // Search Bar Filter
            DOM.searchInput.addEventListener('input', (e) => {
                State.searchQuery = e.target.value;
                if (State.searchQuery.trim()) DOM.btnClearSearch.classList.remove('hidden');
                else DOM.btnClearSearch.classList.add('hidden');
                renderNotesList();
            });

            DOM.btnClearSearch.addEventListener('click', () => {
                DOM.searchInput.value = '';
                State.searchQuery = '';
                DOM.btnClearSearch.classList.add('hidden');
                renderNotesList();
            });

            // Sort Select
            DOM.sortSelect.addEventListener('change', (e) => {
                State.sortBy = e.target.value;
                renderNotesList();
            });

            // Formatting Buttons
            document.querySelectorAll('.fmt-btn').forEach(b => {
                b.addEventListener('click', () => {
                    insertFormatting(b.getAttribute('data-fmt'));
                });
            });

            // Dark Mode Toggle
            DOM.btnThemeToggle.addEventListener('click', () => {
                State.darkMode = !State.darkMode;
                document.documentElement.classList.toggle('dark', State.darkMode);
                saveThemeToStorage();
            });

            // Toggle Sidebar
            DOM.btnToggleSidebar.addEventListener('click', () => {
                DOM.sidebar.classList.toggle('-translate-x-full');
            });

            // Modals - Tag
            DOM.btnAddTag.addEventListener('click', () => {
                DOM.inputTagName.value = '';
                DOM.modalTag.classList.remove('hidden');
                DOM.inputTagName.focus();
            });
            DOM.btnCancelTag.addEventListener('click', () => DOM.modalTag.classList.add('hidden'));
            DOM.btnConfirmTag.addEventListener('click', () => {
                const tagVal = DOM.inputTagName.value.trim();
                const note = getActiveNote();
                if (tagVal && note) {
                    if (!note.tags) note.tags = [];
                    if (!note.tags.includes(tagVal)) {
                        note.tags.push(tagVal);
                        saveNotesToStorage();
                        renderApp();
                    }
                }
                DOM.modalTag.classList.add('hidden');
            });

            // Modals - Folder
            DOM.btnAddFolder.addEventListener('click', () => {
                DOM.inputFolderName.value = '';
                DOM.modalFolder.classList.remove('hidden');
                DOM.inputFolderName.focus();
            });
            DOM.btnCancelFolder.addEventListener('click', () => DOM.modalFolder.classList.add('hidden'));
            DOM.btnConfirmFolder.addEventListener('click', () => {
                const folderVal = DOM.inputFolderName.value.trim();
                if (folderVal && !State.folders.includes(folderVal)) {
                    State.folders.push(folderVal);
                    saveFoldersToStorage();
                    renderApp();
                }
                DOM.modalFolder.classList.add('hidden');
            });

            // Fullscreen
            DOM.btnFullscreen.addEventListener('click', () => {
                if (!document.fullscreenElement) {
                    document.documentElement.requestFullscreen().catch(() => showToast('无法启用全屏', 'warning'));
                } else {
                    document.exitFullscreen();
                }
            });

            // Global Hotkeys
            window.addEventListener('keydown', (e) => {
                // Ctrl+S / Cmd+S: Manual Save
                if ((e.ctrlKey || e.metaKey) && e.key === 's') {
                    e.preventDefault();
                    handleAutoSave();
                    showToast('笔记已保存', 'info');
                }
                // Ctrl+N / Cmd+N: New Note
                if ((e.ctrlKey || e.metaKey) && e.key === 'n') {
                    e.preventDefault();
                    createNewNote();
                }
                // Ctrl+Shift+F: Focus Search
                if ((e.ctrlKey || e.metaKey) && e.shiftKey && (e.key === 'F' || e.key === 'f')) {
                    e.preventDefault();
                    DOM.searchInput.focus();
                }
                // Ctrl+P: Toggle Preview Mode
                if ((e.ctrlKey || e.metaKey) && (e.key === 'p' || e.key === 'P')) {
                    e.preventDefault();
                    State.viewMode = State.viewMode === 'preview' ? 'edit' : 'preview';
                    updateViewModeUI();
                }
            });
        }

        // --- Toast Notifications ---
        function showToast(message, type = 'info') {
            const toast = document.createElement('div');
            toast.className = `flex items-center space-x-2 bg-mono-900 dark:bg-mono-100 text-white dark:text-mono-950 px-3 py-2 rounded-nemo shadow-float text-xs font-medium transform translate-y-2 opacity-0 transition-fast pointer-events-auto border border-mono-700 dark:border-mono-200`;
            
            let icon = 'fa-circle-info';
            if (type === 'warning') icon = 'fa-triangle-exclamation';
            
            toast.innerHTML = `<i class="fa-solid ${icon}"></i><span>${escapeHTML(message)}</span>`;
            DOM.toastContainer.appendChild(toast);

            setTimeout(() => {
                toast.classList.remove('translate-y-2', 'opacity-0');
            }, 10);

            setTimeout(() => {
                toast.classList.add('opacity-0', 'translate-y-2');
                setTimeout(() => toast.remove(), 200);
            }, 2000);
        }

        // --- Helper Utilities ---
        function formatDate(timestamp) {
            const date = new Date(timestamp);
            const now = new Date();
            const isToday = date.toDateString() === now.toDateString();

            if (isToday) {
                return date.toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' });
            }
            return date.toLocaleDateString('zh-CN', { month: 'numeric', day: 'numeric' });
        }

        function escapeHTML(str) {
            if (!str) return '';
            return str.replace(/[&<>"']/g, function(m) {
                return {
                    '&': '&amp;',
                    '<': '&lt;',
                    '>': '&gt;',
                    '"': '&quot;',
                    "'": '&#039;'
                }[m];
            });
        }

        // --- Application Bootstrap ---
        window.onload = function() {
            loadStateFromStorage();

            if (State.notes.length > 0 && !State.activeNoteId) {
                State.activeNoteId = State.notes[0].id;
            }

            setupEventListeners();
            renderApp();
        };
    </script>
</body>
</html>
