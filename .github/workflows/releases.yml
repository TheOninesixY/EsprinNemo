
name: Build and Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and Publish Release
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Read package version
        id: version
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")

          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid package version: $VERSION"
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build all targets
        run: bun build:all

      - name: Prepare release assets
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail

          mkdir -p release-assets

          copy_one() {
            local pattern="$1"
            local destination="$2"
            local -a matches=()

            shopt -s nullglob
            matches=(dist/$pattern)
            shopt -u nullglob

            if [[ ${#matches[@]} -ne 1 ]]; then
              echo "::error::Expected exactly one file matching dist/$pattern, found ${#matches[@]}"
              printf '%s\n' "${matches[@]}"
              exit 1
            fi

            cp -- "${matches[0]}" "release-assets/$destination"
          }

          copy_one "EsprinNemo.Web.v${VERSION}.html" \
            "EsprinNemo.Web.v${VERSION}.html"

          copy_one "EsprinNemo.v${VERSION}.AppImage" \
            "EsprinNemo.v${VERSION}.AppImage"

          copy_one "EsprinNemo.Portable.v${VERSION}.exe" \
            "EsprinNemo.Portable.v${VERSION}.exe"

          copy_one "EsprinNemo.Setup.v${VERSION}.exe" \
            "EsprinNemo.Setup.v${VERSION}.exe"

          copy_one "EsprinSync.v${VERSION}.exe" \
            "EsprinSync.v${VERSION}.exe"

          copy_one "EsprinSync.v${VERSION}" \
            "EsprinSync.v${VERSION}"

          echo "Release assets:"
          ls -lh release-assets

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          body_path: .github/releases.md
          files: |
            release-assets/EsprinNemo.Web.v${{ steps.version.outputs.version }}.html
            release-assets/EsprinNemo.v${{ steps.version.outputs.version }}.AppImage
            release-assets/EsprinNemo.Portable.v${{ steps.version.outputs.version }}.exe
            release-assets/EsprinNemo.Setup.v${{ steps.version.outputs.version }}.exe
            release-assets/EsprinSync.v${{ steps.version.outputs.version }}.exe
            release-assets/EsprinSync.v${{ steps.version.outputs.version }}

      - name: Clean generated release files
        if: success()
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail

          rm -f -- \
            "dist/EsprinNemo.Web.v${VERSION}.html" \
            "dist/EsprinNemo.v${VERSION}.AppImage" \
            "dist/EsprinNemo.Portable.v${VERSION}.exe" \
            "dist/EsprinNemo.Setup.v${VERSION}.exe" \
            "dist/EsprinSync.v${VERSION}.exe" \
            "dist/EsprinSync.v${VERSION}" \
            "dist/EsprinNemo.Setup.v${VERSION}.exe.blockmap"

          rm -rf -- release-assets

          echo "Release assets cleaned."
          echo "node_modules, linux-unpacked and win-unpacked were preserved."
