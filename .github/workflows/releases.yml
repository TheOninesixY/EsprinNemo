
name: Build and Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    container:
      image: electronuserland/builder:wine
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Read package version
        id: version
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid package version: $VERSION"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build all
        run: bun build:all
        env:
          CI: "false"

      - name: Prepare release assets
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p release-assets

          copy_one() {
            local pattern="$1"
            local -a matches=()
            shopt -s nullglob
            matches=(dist/$pattern)
            shopt -u nullglob

            if [[ ${#matches[@]} -ne 1 ]]; then
              echo "::error::Expected one file matching dist/$pattern; found ${#matches[@]}"
              printf '%s\n' "${matches[@]}"
              exit 1
            fi

            cp -- "${matches[0]}" release-assets/
          }

          copy_one "EsprinNemo.Web.v${VERSION}.html"
          copy_one "EsprinNemo.v${VERSION}.AppImage"
          copy_one "EsprinNemo.Portable.v${VERSION}.exe"
          copy_one "EsprinNemo.Setup.v${VERSION}.exe"
          copy_one "EsprinSync.v${VERSION}.exe"
          copy_one "EsprinSync.v${VERSION}"

          test "$(find release-assets -maxdepth 1 -type f | wc -l)" -eq 6
          ls -lh release-assets

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: v${{ steps.version.outputs.version }}
          body_path: .github/releases.md
          fail_on_unmatched_files: true
          files: |
            release-assets/EsprinNemo.Web.v${{ steps.version.outputs.version }}.html
            release-assets/EsprinNemo.v${{ steps.version.outputs.version }}.AppImage
            release-assets/EsprinNemo.Portable.v${{ steps.version.outputs.version }}.exe
            release-assets/EsprinNemo.Setup.v${{ steps.version.outputs.version }}.exe
            release-assets/EsprinSync.v${{ steps.version.outputs.version }}.exe
            release-assets/EsprinSync.v${{ steps.version.outputs.version }}

      - name: Clean release files
        if: success()
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          rm -f -- \
            "dist/EsprinNemo.Web.v${VERSION}.html" \
            "dist/EsprinNemo.v${VERSION}.AppImage" \
            "dist/EsprinNemo.Portable.v${VERSION}.exe" \
            "dist/EsprinNemo.Setup.v${VERSION}.exe" \
            "dist/EsprinSync.v${VERSION}.exe" \
            "dist/EsprinSync.v${VERSION}" \
            "dist/EsprinNemo.Setup.v${VERSION}.exe.blockmap"

          rm -rf release-assets
